version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: turkey-health-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/turkey_health?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    depends_on:
      - db
      - redis
    networks:
      - turkey-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: turkey-health-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - turkey-network

  db:
    image: postgres:15-alpine
    container_name: turkey-health-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=turkey_health
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - turkey-network

  redis:
    image: redis:7-alpine
    container_name: turkey-health-redis
    restart: unless-stopped
    networks:
      - turkey-network

volumes:
  postgres_data:

networks:
  turkey-network:
    driver: bridge
