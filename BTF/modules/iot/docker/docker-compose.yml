version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodyturkey
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloodyturkey2026}
      POSTGRES_DB: bloodyturkey_iot
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodyturkey -d bloodyturkey_iot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bt-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: bt-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bloodyturkey:${DB_PASSWORD:-bloodyturkey2026}@postgres:5432/bloodyturkey_iot?schema=public
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-bloody-turkey-secret-key-2026}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    volumes:
      - ../models:/app/models:ro

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: bt-web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_WS_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10
    container_name: bt-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources

volumes:
  postgres_data:
  redis_data:
  grafana_data:
