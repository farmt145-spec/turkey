[build]
  base = "app"
  command = "npm ci && npm run build && npm run seed:demo"
  publish = "dist/public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200

[[redirects]]
  from = "/api/demo-login"
  to = "/.netlify/functions/demo-login"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
